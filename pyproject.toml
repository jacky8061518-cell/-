[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sector-rotation-research"
version = "0.9.0"
description = "Multi-agent market intelligence desk: continuous scanning, cross-validated evidence, risk-budgeted signal cards, and the underlying rotation research lab."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "plotly>=5.24,<7",
    "streamlit>=1.41,<2",
    "yfinance>=0.2.54,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
